<!doctype html>
<!-- 黑川茜立繪沿用官方第三季角色頁，來源與權利詳見圖片與資料來源.md。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="shared/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(ellipse at 50% 28%, #466c8e90, transparent 55%),
          radial-gradient(ellipse at 22% 60%, #7e6cba55, transparent 57%),
          linear-gradient(130deg, #081a2d, #172340 70%, #152333);
        color: #e5f5ff;
        font-family: "Akane Sans", sans-serif;
      }
      .orbit {
        position: absolute;
        left: 285px;
        top: 5px;
        width: 630px;
        height: 630px;
        border: 1px solid #adcefd44;
        border-radius: 50%;
        box-shadow: 0 0 110px #6d90de20;
      }
      .orbit:after {
        content: "";
        position: absolute;
        inset: 28px;
        border-radius: 50%;
        border: 1px dashed #b3d9ff30;
      }
      .name {
        position: absolute;
        left: 0;
        right: 0;
        top: 50px;
        text-align: center;
        letter-spacing: 10px;
        color: #a6dff1;
        font: 14px Arial;
      }
      .portrait {
        position: absolute;
        left: 420px;
        top: 75px;
        width: 360px;
        height: 648px;
        object-fit: contain;
        object-position: top;
        filter: drop-shadow(0 0 35px #7295d563);
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          #08192e 0%,
          #08192eeb 16%,
          #08192e00 54%
        );
      }
      .title {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 115px;
        margin: 0;
        text-align: center;
        font:
          88px Georgia,
          serif;
        letter-spacing: -2px;
        background: linear-gradient(
          100deg,
          #dff5ff,
          #9bdcff 42%,
          #c6b1ff 62%,
          #efd7ea
        );
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub {
        position: absolute;
        bottom: 63px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        letter-spacing: 4px;
      }
      .foot {
        position: absolute;
        bottom: 27px;
        left: 0;
        right: 0;
        text-align: center;
        color: #9ebdd4;
        font-size: 13px;
        letter-spacing: 2px;
      }
      .spark {
        position: absolute;
        color: #b7dcff;
        font-size: 36px;
        text-shadow: 0 0 30px #bbbdff;
      }
      .one {
        left: 297px;
        top: 160px;
      }
      .two {
        right: 305px;
        top: 270px;
        font-size: 22px;
      }
      .line {
        position: absolute;
        height: 1px;
        width: 220px;
        top: 316px;
        left: 50px;
        background: linear-gradient(90deg, transparent, #9cd5f877);
      }
      .line.right {
        left: auto;
        right: 50px;
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div class="orbit"></div>
    <div class="name">KUROKAWA AKANE</div>
    <img class="portrait" src="assets/akane/hero.webp" alt="黑川茜" />
    <div class="line"></div>
    <div class="line right"></div>
    <span class="spark one">✦</span><span class="spark two">✧</span>
    <div class="shade"></div>
    <h1 class="title">Blue World</h1>
    <div class="sub">黑川茜的藍色世界</div>
    <div class="foot">角色收藏 · 小小互動 · 自製小遊戲</div>
  </body>
</html>
